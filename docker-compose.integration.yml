# Compose de INTEGRACIÓN del sistema PDF ExtractText:
#   Cliente → Traefik (web) → Orchestrator → Traefik (interno) → Validator / Extractor / Persistence → MongoDB
#
# - Solo Traefik publica un puerto hacia el host (entrypoint web); el resto queda en redes internas.
# - El Orchestrator llama a los tres servicios a través del entrypoint interno de Traefik
#   (traefik:8081/<servicio>, no publicado). Cada servicio se registra en Consul y Traefik lo descubre
#   mediante su provider consulCatalog, con su propio circuit breaker.
# - Validator, Extractor y Persistence se construyen desde su repositorio fijado a un SHA
#   completo (inmutable). Cada contexto se puede reemplazar por una ruta local con
#   VALIDATOR_CONTEXT, EXTRACTOR_CONTEXT y PERSISTENCE_CONTEXT.
# - Base y volumen exclusivos de integración: pdf_extractext_integracion y pdf-integracion-mongo-data.
#
# Uso: docker compose -f docker-compose.integration.yml up --build -d --wait
# Ver la sección "Integración con Docker Compose" del README.
name: pdf-integracion

configs:
  # Configuración dinámica de Traefik (file provider): las labels/tags pueden referenciar un
  # serversTransport, pero no definirlo. Este timeout se aplica solo a los tres servicios internos.
  traefik-dinamico:
    content: |
      http:
        serversTransports:
          interno:
            forwardingTimeouts:
              responseHeaderTimeout: 8s

services:
  traefik:
    image: traefik:v3.6
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.consulcatalog=true
      - --providers.consulcatalog.endpoint.address=consul:8500
      - --providers.consulcatalog.exposedbydefault=false
      - --providers.consulcatalog.refreshinterval=500ms
      - --providers.file.filename=/etc/traefik/dinamico.yml
      - --entrypoints.web.address=:80
      - --entrypoints.interno.address=:8081
      - --log.level=INFO
    ports:
      - "${PUBLIC_PORT:-8080}:80"
    configs:
      - source: traefik-dinamico
        target: /etc/traefik/dinamico.yml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - edge
      - backend
    depends_on:
      consul:
        condition: service_healthy
      orchestrator:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  consul:
    image: hashicorp/consul:1.20
    command:
      - agent
      - -dev
      - -client=0.0.0.0
    networks:
      - backend
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  orchestrator:
    build: .
    environment:
      VALIDATOR_URL: http://traefik:8081/validator
      EXTRACTOR_URL: http://traefik:8081/extractor
      PERSISTENCE_URL: http://traefik:8081/persistence
      HTTP_TIMEOUT_SECONDS: "10"
      LOG_LEVEL: INFO
      PORT: "8000"
    labels:
      - traefik.enable=true
      - traefik.docker.network=pdf-integracion-edge
      - traefik.http.routers.orchestrator.rule=PathPrefix(`/`)
      - traefik.http.routers.orchestrator.entrypoints=web
      - traefik.http.services.orchestrator.loadbalancer.server.port=8000
    networks:
      - edge
      - backend
    depends_on:
      validator:
        condition: service_healthy
      extractor:
        condition: service_healthy
      persistence:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  validator:
    build:
      context: "${VALIDATOR_CONTEXT:-https://github.com/sharonvicode/pdf-validator-service.git#609f2e47a9ddf1e68a9a148984679361ad7eabfe}"
    environment:
      MAX_FILE_SIZE_MB: "10"
      CONSUL_URL: http://consul:8500
      CONSUL_SERVICE_TAGS: >-
        [
          "traefik.enable=true",
          "traefik.http.routers.validator.rule=PathPrefix(`/validator`)",
          "traefik.http.routers.validator.entrypoints=interno",
          "traefik.http.routers.validator.middlewares=validator-circuit-breaker,validator-sin-prefijo",
          "traefik.http.middlewares.validator-sin-prefijo.stripprefix.prefixes=/validator",
          "traefik.http.middlewares.validator-circuit-breaker.circuitbreaker.expression=NetworkErrorRatio() > 0.50",
          "traefik.http.middlewares.validator-circuit-breaker.circuitbreaker.fallbackDuration=10s",
          "traefik.http.middlewares.validator-circuit-breaker.circuitbreaker.recoveryDuration=10s",
          "traefik.http.services.validator.loadbalancer.serverstransport=interno@file"
        ]
    networks:
      - backend
    depends_on:
      consul:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M

  extractor:
    build:
      context: "${EXTRACTOR_CONTEXT:-https://github.com/sharonvicode/pdf-extract-service.git#fbb9069067cd66060ae6f0820658ccb7ebe796d4}"
    environment:
      MAX_FILE_SIZE_MB: "10"
      EXTRACTION_CONCURRENCY: "1"
      EXTRACTION_QUEUE_SIZE: "20"
      RETRY_AFTER_SECONDS: "1"
      LOG_LEVEL: INFO
      CONSUL_URL: http://consul:8500
      CONSUL_SERVICE_TAGS: >-
        [
          "traefik.enable=true",
          "traefik.http.routers.extractor.rule=PathPrefix(`/extractor`)",
          "traefik.http.routers.extractor.entrypoints=interno",
          "traefik.http.routers.extractor.middlewares=extractor-circuit-breaker,extractor-sin-prefijo",
          "traefik.http.middlewares.extractor-sin-prefijo.stripprefix.prefixes=/extractor",
          "traefik.http.middlewares.extractor-circuit-breaker.circuitbreaker.expression=NetworkErrorRatio() > 0.50",
          "traefik.http.middlewares.extractor-circuit-breaker.circuitbreaker.fallbackDuration=10s",
          "traefik.http.middlewares.extractor-circuit-breaker.circuitbreaker.recoveryDuration=10s",
          "traefik.http.services.extractor.loadbalancer.serverstransport=interno@file"
        ]
    networks:
      - backend
    depends_on:
      consul:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  persistence:
    build:
      context: "${PERSISTENCE_CONTEXT:-https://github.com/sharonvicode/pdf-persistence-service.git#11f59f5af8196328c743502616e6ce8eea4e57c5}"
    environment:
      # serverSelectionTimeoutMS: si MongoDB no responde, Persistence falla a los 5 s (antes de
      # escribir) en lugar de los 30 s por defecto de pymongo, que superan el timeout del Orchestrator.
      MONGODB_URI: mongodb://mongo:27017/?serverSelectionTimeoutMS=5000
      MONGODB_DATABASE: pdf_extractext_integracion
      CONSUL_URL: http://consul:8500
      CONSUL_SERVICE_TAGS: >-
        [
          "traefik.enable=true",
          "traefik.http.routers.persistence.rule=PathPrefix(`/persistence`)",
          "traefik.http.routers.persistence.entrypoints=interno",
          "traefik.http.routers.persistence.middlewares=persistence-circuit-breaker,persistence-sin-prefijo",
          "traefik.http.middlewares.persistence-sin-prefijo.stripprefix.prefixes=/persistence",
          "traefik.http.middlewares.persistence-circuit-breaker.circuitbreaker.expression=NetworkErrorRatio() > 0.50",
          "traefik.http.middlewares.persistence-circuit-breaker.circuitbreaker.fallbackDuration=10s",
          "traefik.http.middlewares.persistence-circuit-breaker.circuitbreaker.recoveryDuration=10s",
          "traefik.http.services.persistence.loadbalancer.serverstransport=interno@file"
        ]
    networks:
      - backend
    depends_on:
      mongo:
        condition: service_healthy
      consul:
        condition: service_healthy
    healthcheck:
      # Solo comprueba que el PROCESO responde (FastAPI expone /openapi.json por defecto).
      # NO comprueba la conectividad con MongoDB: Persistence no tiene un endpoint /health.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  mongo:
    image: mongo:8.0
    volumes:
      - mongo-data:/data/db
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

networks:
  # Traefik y Orchestrator: la única red con un puerto publicado.
  edge:
    name: pdf-integracion-edge
  # Traefik (entrypoint interno), Orchestrator, servicios internos y MongoDB, sin salida a internet.
  backend:
    name: pdf-integracion-backend
    internal: true

volumes:
  mongo-data:
    name: pdf-integracion-mongo-data
